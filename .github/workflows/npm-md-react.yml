name: Bump and stage md-react on npm

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'skip'
        type: choice
        options:
          - skip
          - patch
          - minor
          - major
  pull_request:
    branches: 
      - main
    paths:
      - 'packages/react/**'
    types:
      - closed

jobs:
  bump:
    name: Bump, build & stage md-react
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.pull_request.merged == true
    concurrency:
      group: npm-stage-md-react
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./packages/react
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Set up npm
        run: npm install --global npm@11

      - name: Determine version bump
        id: bump
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=$VERSION_BUMP" >> $GITHUB_OUTPUT
          elif echo "$PR_LABELS" | grep -q '"major"'; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$PR_LABELS" | grep -q '"minor"'; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$PR_LABELS" | grep -q '"patch"'; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "No major, minor or patch label (e.g. skip-release), skipping staging"
            echo "type=skip" >> $GITHUB_OUTPUT
          fi

      - name: Apply version bump
        if: steps.bump.outputs.type != 'skip'
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Inspect existing npm staging, then use Run workflow on main instead of Re-run jobs."
            exit 1
          fi
          npm stage list @miljodirektoratet/md-react --json --workspaces=false > "$RUNNER_TEMP/npm-stages.json"
          node -e 'const stages = require(process.env.RUNNER_TEMP + "/npm-stages.json"); if (!Array.isArray(stages) || stages.length) { console.error("Approve or reject pending staging before starting a new run:", stages); process.exit(1); }'
          LATEST=$(npm view @miljodirektoratet/md-react version)
          npm version "$LATEST" --no-git-tag-version --allow-same-version
          npm version "$VERSION_BUMP" --no-git-tag-version
          echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
        env:
          VERSION_BUMP: ${{ steps.bump.outputs.type }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}

      - name: Install dependencies
        if: steps.bump.outputs.type != 'skip'
        run: npm install

      - name: Build
        if: steps.bump.outputs.type != 'skip'
        run: npm run build

      - name: Stage package on npm
        if: steps.bump.outputs.type != 'skip'
        run: |
          npm stage publish --access public --workspaces=false > "$RUNNER_TEMP/npm-stage.txt"
          cat "$RUNNER_TEMP/npm-stage.txt"
          {
            echo "## Awaiting npm approval"
            echo "Package: md-react@$PKG_VERSION"
            echo "Source commit: $(git rev-parse HEAD)"
            echo '```text'
            cat "$RUNNER_TEMP/npm-stage.txt"
            echo '```'
            echo "Approve on npm with 2FA, then run Finalize approved npm release with this package, version and source commit."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}